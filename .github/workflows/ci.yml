name: CI

on:
  push:
  pull_request:

# Un push nuevo sobre la misma rama o PR cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    env:
      MOCK_DATA: "true" # mercado sintético: los tests no necesitan red ni tokens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Tests
        run: pytest
      - name: Ingesta sintética de extremo a extremo
        run: python -m app.pipelines.market_ingestion --mock

  frontend:
    name: Frontend · lint, tipos y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Linter
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Build de producción
        run: npm run build

  docker:
    name: Docker · build del stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: docker compose config --quiet
      - name: Construir las imágenes
        run: docker compose build
      - name: Arrancar el stack (ingesta, API y dashboard)
        run: docker compose up --detach
      - name: Comprobar API y dashboard
        run: |
          timeout 180 sh -c 'until curl --fail --silent --output /dev/null http://localhost:8000/api/v1/health; do sleep 3; done'
          timeout 120 sh -c 'until curl --fail --silent --output /dev/null http://localhost:3000/; do sleep 3; done'
          curl --fail --silent --show-error http://localhost:8000/api/v1/regulatory/parameters --output /dev/null
      - name: Tests dentro de la imagen del backend
        run: docker compose run --rm --no-deps api pytest -q
      - name: Logs si algo falla
        if: failure()
        run: docker compose logs --no-color
      - name: Parar el stack
        if: always()
        run: docker compose down --volumes
